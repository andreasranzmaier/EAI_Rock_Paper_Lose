# Accessory detector config (read by rock_paper_lose at startup).
# HSV bounds use OpenCV ranges: hue 0-179, sat 0-255, val 0-255.
# Defaults target a pink accessory.
#
# To re-tune for a different colour or lighting:
#   1. Run the binary; the "Accessory baseline = ... px" line prints how many
#      pixels normally fall inside the range on an empty scene. It should be
#      small (low tens of pixels) - if it's already thousands, the range is
#      catching the background and needs tightening.
#   2. With the accessory in frame, expect that count to jump well above
#      baseline * threshold_multiplier. Adjust the multiplier or the HSV
#      bounds until the "accessory=yes" line in the round log matches reality.

hue_min = 120
hue_max = 175
sat_min = 35
sat_max = 255
val_min = 31
val_max = 183

calibration_frames    = 60
threshold_multiplier  = 10.0
min_threshold         = 500
